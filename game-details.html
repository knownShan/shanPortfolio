<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games // Shan Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
    /* ================= ROOT & GLOBAL ================= */
    :root {
        --bg-black: #050505;
        --dark-grey: #1a1a1a;
        --medium-grey: #333333;
        --pixel-green: #39ff14;
        --pure-white: #ffffff;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: var(--bg-black);
        color: var(--pure-white);
        font-family: 'VT323', monospace;
        line-height: 1.4;
        overflow-y: overlay;
    }

    /* ================= SCROLLBAR ================= */
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: var(--bg-black); }
    ::-webkit-scrollbar-thumb {
        background: var(--medium-grey);
        border: 2px solid var(--bg-black);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--pixel-green); }

    /* ================= NAV ================= */
    nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5%;
        height: 90px;
        background: var(--dark-grey);
        border-bottom: 4px solid var(--medium-grey);
    }

    .nav-back {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--pixel-green);
        font-family: 'Press Start 2P', cursive;
        font-size: 0.7rem;
        transition: 0.2s;
    }

    .nav-logo {
        font-family: 'Press Start 2P', cursive;
        font-size: 1.8rem;
        color: var(--pure-white);
        text-shadow: 2px 2px 0 var(--pixel-green);
        letter-spacing: 2px;
        text-decoration: none;
    }

    .nav-spacer { flex: 1; }

    /* ================= UNITY GAME CONTAINER (FIXED) ================= */
    .game-container {
        width: 90%;
        max-width: 1200px;
        margin: 40px auto;
        background: #000;
        border: 4px solid var(--medium-grey);
        position: relative;
        box-shadow: 0 0 30px rgba(57, 255, 20, 0.1);
        overflow: hidden;
    }

    /* Aspect-ratio lock (16:9 desktop) */
    .game-container::before {
        content: "";
        display: block;
        padding-top: 56.25%;
    }

    /* Force iframe to fully fill container */
    .game-container iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
    }

    /* ================= CONTROLS ================= */
    .controls-bar {
        width: 90%;
        max-width: 1200px;
        margin: -30px auto 40px;
        display: flex;
        justify-content: flex-end;
    }

    .fs-btn {
        background: none;
        border: 2px solid var(--medium-grey);
        color: var(--pixel-green);
        font-family: 'Press Start 2P', cursive;
        font-size: 0.6rem;
        padding: 8px 15px;
        cursor: pointer;
    }

    .fs-btn:hover {
        background: var(--pixel-green);
        color: var(--bg-black);
    }

    /* ================= CONTENT ================= */
    .content-area {
        width: 90%;
        max-width: 1200px;
        margin: 0 auto 100px;
        display: grid;
        grid-template-columns: 1fr 350px;
        gap: 50px;
        align-items: start;
    }

    .breadcrumbs {
        grid-column: 1 / -1;
        font-size: 1rem;
        color: var(--pixel-green);
        margin-bottom: 20px;
        text-transform: uppercase;
    }

    .game-title {
        font-family: 'Press Start 2P', cursive;
        font-size: 2.5rem;
        margin-bottom: 10px;
    }

    .dev-credit {
        font-size: 1.2rem;
        color: #888;
        margin-bottom: 15px;
    }

    .description {
        font-size: 1.5rem;
        color: #ccc;
        border-top: 2px solid var(--medium-grey);
        padding-top: 30px;
    }

    .poster-wrapper {
        width: 100%;
        aspect-ratio: 1 / 1.414;
        background: var(--dark-grey);
        border: 4px solid var(--medium-grey);
        box-shadow: 10px 10px 0 rgba(0,0,0,0.5);
        overflow: hidden;
    }

    .poster-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .tags-row {
        margin-top: 30px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .tag {
        background: var(--medium-grey);
        padding: 5px 15px;
        font-size: 1rem;
    }
    /* ================= FOOTER ================= */
    .game-footer {
        background: var(--dark-grey);
        border-top: 4px solid var(--medium-grey);
        padding: 40px 5% 20px;
        margin-top: 80px;
    }

    .game-footer-inner {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 30px;
    }

    .footer-left h3 {
        font-family: 'Press Start 2P', cursive;
        font-size: 1rem;
        color: var(--pixel-green);
        text-shadow: 2px 2px 0 var(--bg-black);
    }

    .footer-left p {
        font-size: 1.1rem;
        color: #aaa;
    }

    .footer-center {
        text-align: center;
        font-size: 1.1rem;
        color: var(--pure-white);
    }

    .pixel-line {
        color: var(--pixel-green);
        letter-spacing: 4px;
        margin: 0 10px;
    }

    .footer-right {
        display: flex;
        justify-content: flex-end;
        gap: 20px;
        flex-wrap: wrap;
    }

    .footer-right a {
        font-family: 'Press Start 2P', cursive;
        font-size: 0.6rem;
        color: var(--pure-white);
        text-decoration: none;
        border-bottom: 2px solid transparent;
        transition: 0.2s;
    }

    .footer-right a:hover {
        color: var(--pixel-green);
        border-color: var(--pixel-green);
    }

    .footer-bottom {
        margin-top: 30px;
        text-align: center;
        font-size: 1rem;
        color: #777;
    }

    /* ================= FOOTER RESPONSIVE ================= */
    @media (max-width: 768px) {
        .game-footer-inner {
            grid-template-columns: 1fr;
            text-align: center;
        }

        .footer-right {
            justify-content: center;
        }
    }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 1024px) {
        .content-area {
            grid-template-columns: 1fr;
        }
        .poster-wrapper {
            max-width: 400px;
            margin: 0 auto;
        }
    }

    /* Mobile: switch Unity to 4:3 */
    @media (max-width: 768px) {
        .game-container::before {
            padding-top: 75%;
        }
    }
</style>

</head>
<body>

    <nav>
        <a href="index.html" class="nav-back"><i data-lucide="arrow-left"></i> BACK TO HOME</a>
        <a href="index.html" class="nav-logo">SHAN</a>
        <div class="nav-spacer"></div> 
    </nav>

    <main>
        <div class="game-container" id="unity-viewport">
            </div>
        <div class="controls-bar">
            <button class="fs-btn" onclick="openFullscreen()">FULLSCREEN</button>
        </div>

        <section class="content-area">
            <div class="breadcrumbs" id="game-breadcrumbs">Portfolio > My Game > Loading...</div>
            
            <div class="info-column">
                <div class="game-header">
                    <h1 class="game-title" id="game-title">LOADING...</h1>
                    <p class="dev-credit" id="game-author"></p>
                </div>

                <article class="description" id="game-description">
                    <p>Fetching game data...</p>
                </article>

                <div class="tags-row" id="game-tags"></div>
            </div>

            <div class="poster-column">
                <div class="poster-wrapper">
                    <img id="game-poster" src="" alt="Game Poster" class="poster-img">
                </div>
            </div>
        </section>
    </main>

    <script>
        const gameData = {
            "nestiny": {
                title: "NESTINY",
                author: "Shan",
                buildPath: "Game_Builds/Nestiny/index.html",
                breadcrumbs: "Portfolio > My Game > Nestiny",
                description: `
                    <p>In Nestiny, you play as a chicken on a desperate quest to retrieve your scattered eggs. This isn't your average platformer; it's a test of precision and timing. Locate your missing eggs across handcrafted levels and bring them safely to the nest.</p>
                    <br>
                    <p>The goal is clear: satisfy the nest's egg requirement to unlock the path to the next level. But be warned—reaching the egg is only half the battle. Once picked up, the egg <strong>bounces on your back</strong>; if it hits its bounce limit before reaching the nest, it will be destroyed.</p>`,
                tags: ["PC GAME","PLATFORMER"],
                poster: "Game_Pictures/Nestiny Poster.jpg"
            },
            "think-inside-the-box": {
                title: "THINK INSIDE THE BOX",
                author: "Shan",
                buildPath: "Game_Builds/Think Inside the Box/index.html",
                breadcrumbs: "Portfolio > My Game > Think Inside the Box",
                description: `
                    <p>Escape is the only option. In <strong>Think Inside the Box</strong>, you play as a sentient parcel trapped within a massive, automated shipping factory.</p>
                    <br>
                    <p>Navigate through hazardous assembly lines and solve complex environmental puzzles that require sharp thinking and precise movement. Each level increases in difficulty, introducing lethal traps, automated enemies, and industrial hazards.</p>
                    <br>
                    <p>Can you outsmart the factory machinery and earn your freedom, or will you be just another box on the shelf?
                    </p>`,
                tags: ["PC GAME", "PLATFORMER", "PUZZLE"],
                poster: "Game_Pictures/Think Inside The Box Poster.jpg"
            },
            "glow-craft": {
                title: "GLOWCRAFT",
                author: "Shan",
                buildPath: "Game_Builds/Glowcraft/index.html",
                breadcrumbs: "Portfolio > My Game > GlowCraft",
                description: `
                    <p>GrowCraft is a top-down rogue-like survival platformer where light is both your hope—and your curse.</p>
                    <br>
                    <p>You play as a wood crafter, protecting a fragile firefly’s light that attracts relentless zombies lurking in the dark. Drawn to its glow, some enemies seek to devour the light itself, while others hunt you relentlessly across the map.</p>
                    <br>
                    <p>The firefly’s light slowly fades every second, forcing you to stay on the move. To keep it alive, you must collect light fruits scattered throughout the world and feed them to the firefly before darkness takes over.
                    </p>
                    <br>
                    <p>Armed with only your axe, you must fight back waves of enemies, manage the growing danger of the light, and survive for as long as you can. Every run is a test of skill, timing, and endurance—
how long can you protect the light before it fades?</p>`,
                tags: ["PC GAME", "PLATFORMER", "ROUGUE-LIKE", "SURVIVAL"],
                poster: "Game_Pictures/Glowcraft Poster.jpg"
            },
            "wata-wars": {
                title: "WATAWARS",
                author: "Shan / Badjoes Studio",
                buildPath: "Game_Builds/WataWars/index.html",
                breadcrumbs: "Portfolio > My Game > Nestiny",
                description: `
                    <p>WataWars is a competitive 2-player 3D Capture the Flag game inspired by the streets of the Philippines. Players go head-to-head in fast, action-packed matches, fighting to snatch the enemy Banderitas while defending their own. The game takes place in vibrant urban environments filled with bustling markets, neighborhood basketball courts, and narrow side alleys that create unpredictable routes and intense chases. With quick movement, strategic play, and an authentic Filipino atmosphere, WataWars delivers chaotic fun and pure rivalry in every match.</p>
                    `,
                tags: ["PC GAME","3D GAME", "2 PLAYER GAME"],
                poster: "Game_Pictures/WataWars Poster.jpg"
            },
        };

        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');

        if (gameId && gameData[gameId]) {
            const data = gameData[gameId];
            
            document.getElementById('game-title').innerText = data.title;
            document.getElementById('game-breadcrumbs').innerText = data.breadcrumbs;
            document.getElementById('game-description').innerHTML = data.description;
            document.getElementById('game-poster').src = data.poster;

            document.getElementById('game-author').innerText = `by ${data.author}`;
            // Load the Unity Game
            document.getElementById('unity-viewport').innerHTML = `
                <iframe 
                    id="unity-iframe"
                    src="${data.buildPath}"
                    allow="autoplay; fullscreen; gamepad"
                    sandbox="allow-scripts allow-same-origin allow-pointer-lock"
                ></iframe>
            `;


            const tagsContainer = document.getElementById('game-tags');
            data.tags.forEach(tagName => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.innerText = tagName;
                tagsContainer.appendChild(span);
            });
        }

        function openFullscreen() {
            const elem = document.getElementById("unity-iframe");
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
        }

        lucide.createIcons();
    </script>
    <footer class="game-footer">
        <div class="game-footer-inner">
            <div class="footer-left">
                <h3>SHAN</h3>
                <p>INDIE GAME DEVELOPER</p>
            </div>

            <div class="footer-center">
                <span class="pixel-line">■ ■ ■</span>
                <span>PLAY • EXPLORE • CREATE</span>
                <span class="pixel-line">■ ■ ■</span>
            </div>

            <div class="footer-right">
                <a href="index.html">HOME</a>
                <a href="mailto:your@email.com">CONTACT</a>
                <a href="https://github.com/yourusername" target="_blank">GITHUB</a>
            </div>
        </div>

        <div class="footer-bottom">
            © 2025 SHAN • MADE WITH UNITY
        </div>
    </footer>

</body>
</html>
