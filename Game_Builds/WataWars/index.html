<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

<title>Unity WebGL Player | WataWars</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#unity-container {
    width: 100%;
    height: 100%;
}

#unity-canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
    background: url('Build/WataWarts WebGL Build.jpg') center / cover;
}
</style>
</head>

<body>
<div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<script src="Build/WataWarts WebGL Build.loader.js"></script>
<script>
createUnityInstance(document.querySelector("#unity-canvas"), {
    dataUrl: "Build/WataWarts WebGL Build.data",
    frameworkUrl: "Build/WataWarts WebGL Build.framework.js",
    codeUrl: "Build/WataWarts WebGL Build.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "BADJOES STUDIO",
    productName: "WataWars",
    productVersion: "1.0"
}).then(() => {
    // Fix iframe first-load sizing bug
    setTimeout(() => {
        window.dispatchEvent(new Event("resize"));
    }, 100);
});
</script>
</body>
</html>
